schema_version: 1
terminal: revenant
name: Revenant
page: terminals/revenant.md
features:
  osc-7-working-directory:
    status: partial
    as-of: git:e2b248588a26dc4cc7e6eaf5fa34286584d093ab
    notes: Retains a validated local directory; no consumer yet. Oversized OSC 7 clears retained state. Does not
      chdir.
    review: reviewed
    checked: '2026-09-10'
    evidence:
    - kind: test
      url: https://github.com/toppk/revenant/blob/e2b248588a26dc4cc7e6eaf5fa34286584d093ab/tests/xvfb-working-directory.sh
  sgr-58-underline-color:
    status: supported
    as-of: git:e2b248588a26dc4cc7e6eaf5fa34286584d093ab
    notes: Explicit underline ink stays opaque through inverse, selection and faint; SGR 59 restores text color.
    review: reviewed
    checked: '2026-09-10'
    evidence:
    - kind: test
      url: https://github.com/toppk/revenant/blob/e2b248588a26dc4cc7e6eaf5fa34286584d093ab/tests/xvfb-underline-color.sh
  dcs-xtgettcap:
    status: partial
    as-of: git:e2b248588a26dc4cc7e6eaf5fa34286584d093ab
    notes: TN agrees with child TERM. This assessment covers TN only; the full capability set is not assessed. GetTcap
      policy applies.
    review: reviewed
    checked: '2026-09-10'
    evidence:
    - kind: test
      url: https://github.com/toppk/revenant/blob/e2b248588a26dc4cc7e6eaf5fa34286584d093ab/tests/xvfb-term-name.sh
  c0-enq-answerback:
    status: supported
    as-of: git:e2b248588a26dc4cc7e6eaf5fa34286584d093ab
    notes: Configured bytes sent verbatim; default empty string is silent.
    review: reviewed
    checked: '2026-09-10'
    evidence:
    - kind: test
      url: https://github.com/toppk/revenant/blob/e2b248588a26dc4cc7e6eaf5fa34286584d093ab/tests/xvfb-answerback.sh
  csi-da1:
    status: supported
    as-of: git:fd6dee5cbec31ee19ed4be6514e63fc08088b123
    notes: 'Replies CSI ? 62 ; 6 ; 21 ; 22 c: VT220 level with selective erase, left/right margins and ANSI color,
      each pinned by rendered-cell backend tests. 132 columns, Sixel, ReGIS, locator, rectangular editing and
      Ghostty''s clipboard code are deliberately absent. Nonzero parameters are answered (xterm ignores them).'
    review: reviewed
    checked: '2026-09-11'
    evidence:
    - kind: test
      url: https://github.com/toppk/revenant/blob/fd6dee5cbec31ee19ed4be6514e63fc08088b123/tests/xvfb-device-attributes.sh
    - kind: test
      url: https://github.com/toppk/revenant/blob/fd6dee5cbec31ee19ed4be6514e63fc08088b123/src/selftest.c
    - kind: source
      url: https://github.com/toppk/revenant/blob/fd6dee5cbec31ee19ed4be6514e63fc08088b123/src/device_attributes.h
  csi-da2:
    status: supported
    as-of: git:fd6dee5cbec31ee19ed4be6514e63fc08088b123
    notes: 'Replies CSI > 1 ; Pv ; 0 c with Pv = major * 10000 + minor * 100 + patch of the Revenant version. The
      type is VT220 to match DA1; XTVERSION is the identification path.'
    review: reviewed
    checked: '2026-09-11'
    evidence:
    - kind: test
      url: https://github.com/toppk/revenant/blob/fd6dee5cbec31ee19ed4be6514e63fc08088b123/tests/xvfb-device-attributes.sh
    - kind: source
      url: https://github.com/toppk/revenant/blob/fd6dee5cbec31ee19ed4be6514e63fc08088b123/src/device_attributes.c
  csi-da3:
    status: supported
    as-of: git:fd6dee5cbec31ee19ed4be6514e63fc08088b123
    notes: Replies DCS ! | 00000000 ST at every level; there is no unit ID. xterm answers only at VT420 or higher.
    review: reviewed
    checked: '2026-09-11'
    evidence:
    - kind: test
      url: https://github.com/toppk/revenant/blob/fd6dee5cbec31ee19ed4be6514e63fc08088b123/tests/xvfb-device-attributes.sh
  csi-xtversion:
    status: supported
    as-of: git:fd6dee5cbec31ee19ed4be6514e63fc08088b123
    notes: Replies DCS > | revenant(<version>) ST following xterm's XTerm(411) display form with the actual product
      and version.
    review: reviewed
    checked: '2026-09-11'
    evidence:
    - kind: test
      url: https://github.com/toppk/revenant/blob/fd6dee5cbec31ee19ed4be6514e63fc08088b123/tests/xvfb-device-attributes.sh
  diagnostics-unknown-apc:
    status: supported
    as-of: git:ab0907105bf6a871ef473dfbc0e929c8ff6b4d11
    notes: Completed APCs other than Kitty graphics and the glyph protocol are logged at info level with up to 256
      payload bytes and a truncation flag; no reply, no permission. ESC ends an APC; CAN/SUB abort without a
      report. Other C0 bytes, including NUL, are retained as binary data. OSC/CSI remain invisible (upstream
      limitation).
    review: reviewed
    checked: '2026-09-11'
    evidence:
    - kind: test
      url: https://github.com/toppk/revenant/blob/ab0907105bf6a871ef473dfbc0e929c8ff6b4d11/tests/xvfb-unknown-apc.sh
    - kind: test
      url: https://github.com/toppk/revenant/blob/ab0907105bf6a871ef473dfbc0e929c8ff6b4d11/src/selftest.c
  notification-desktop-delivery:
    status: supported
    as-of: git:9e0c8ca655865a6f081e20d0d5b598f5080740f3
    notes: With libnotify compiled in, unfocused OSC 9 and OSC 777 requests are delivered to
      org.freedesktop.Notifications with the application icon, escaped markup, U+FFFD for invalid and control
      bytes, 256/1024-byte title/body limits, at most 5 attempts per 10 s, a 5 s failure backoff and recovery;
      focused requests are logged only, urgency is unchanged, and builds without libnotify report unavailable.
    review: reviewed
    checked: '2026-09-13'
    evidence:
    - kind: test
      url: https://github.com/toppk/revenant/blob/9e0c8ca655865a6f081e20d0d5b598f5080740f3/tests/xvfb-desktop-notification.sh
  osc-9-notification:
    status: supported
    as-of: git:9e0c8ca655865a6f081e20d0d5b598f5080740f3
    notes: iTerm2 form decoded with an empty title and the body as sent, logged, and mapped to X11 urgency while
      unfocused. Builds with libnotify deliver it to the desktop while unfocused; builds without it retain logging
      and urgency. Valid ConEmu forms remain separate; incomplete or invalid ConEmu-shaped payloads fall back to
      notification text in libghostty.
    review: reviewed
    checked: '2026-09-13'
    evidence:
    - kind: test
      url: https://github.com/toppk/revenant/blob/9e0c8ca655865a6f081e20d0d5b598f5080740f3/tests/xvfb-desktop-notification.sh
    - kind: test
      url: https://github.com/toppk/revenant/blob/9e0c8ca655865a6f081e20d0d5b598f5080740f3/tests/xvfb-notification-urgency.sh
  osc-9-4-progress:
    status: supported
    as-of: git:e01f7b9333cf730f33bb73276a03c71a6a707182
    notes: OSC 9;4 set, error, indeterminate, paused and remove reports reach the progress indicator; values above
      100 clamp to 100, error and paused without a value keep the last percentage, and RIS and process exit
      remove progress. Title properties, the title stack and title reports are unaffected.
    review: reviewed
    checked: '2026-09-13'
    evidence:
    - kind: test
      url: https://github.com/toppk/revenant/blob/e01f7b9333cf730f33bb73276a03c71a6a707182/tests/xvfb-progress.sh
  osc-777-notification:
    status: supported
    as-of: git:9e0c8ca655865a6f081e20d0d5b598f5080740f3
    notes: notify;title;body is decoded, logged, and mapped to X11 urgency while unfocused. Builds with libnotify
      deliver it to the desktop while unfocused; builds without it retain logging and urgency. Other rxvt
      extensions are dropped by the core.
    review: reviewed
    checked: '2026-09-13'
    evidence:
    - kind: test
      url: https://github.com/toppk/revenant/blob/9e0c8ca655865a6f081e20d0d5b598f5080740f3/tests/xvfb-desktop-notification.sh
    - kind: test
      url: https://github.com/toppk/revenant/blob/9e0c8ca655865a6f081e20d0d5b598f5080740f3/tests/xvfb-notification-urgency.sh
  notification-x11-urgency:
    status: supported
    as-of: git:87fdc41407fe2a096bd7f5d59456bfe61b7b80f9
    notes: XUrgencyHint is set for notifications received while unfocused and cleared on focus-in. Every other
      WM_HINTS field is preserved, repeated requests are idempotent, and failed hint updates remain retryable.
    review: reviewed
    checked: '2026-09-11'
    evidence:
    - kind: test
      url: https://github.com/toppk/revenant/blob/87fdc41407fe2a096bd7f5d59456bfe61b7b80f9/tests/xvfb-notification-urgency.sh
    - kind: source
      url: https://github.com/toppk/revenant/blob/87fdc41407fe2a096bd7f5d59456bfe61b7b80f9/src/urgency.c
  ui-progress-indicator:
    status: supported
    as-of: git:e01f7b9333cf730f33bb73276a03c71a6a707182
    notes: A non-focusable Athena bar in the terminal's top-right corner shows normal progress in the foreground
      color, errors in red, paused work in amber and indeterminate work as a moving block; it follows resize,
      updates during synchronized-output holds and stays visible without a scrollbar.
    review: reviewed
    checked: '2026-09-13'
    evidence:
    - kind: test
      url: https://github.com/toppk/revenant/blob/e01f7b9333cf730f33bb73276a03c71a6a707182/tests/xvfb-progress.sh
  csi-decscusr:
    status: partial
    as-of: git:e2b248588a26dc4cc7e6eaf5fa34286584d093ab
    notes: 0 and omitted restore the configured startup shape. xterm-specific style 7 is not recognized.
    review: reviewed
    checked: '2026-09-10'
    evidence:
    - kind: test
      url: https://github.com/toppk/revenant/blob/e2b248588a26dc4cc7e6eaf5fa34286584d093ab/tests/xvfb-cursor-shape.sh
  osc-8-hyperlinks:
    status: partial
    as-of: git:e2b248588a26dc4cc7e6eaf5fa34286584d093ab
    notes: Shift-hover underlines OSC 8 links; Shift+Button 1 activates HTTP(S). Other URI schemes are inert.
    review: reviewed
    checked: '2026-09-10'
    evidence:
    - kind: test
      url: https://github.com/toppk/revenant/blob/e2b248588a26dc4cc7e6eaf5fa34286584d093ab/tests/xvfb-hyperlink-hover.sh
  dec-mode-2026-synchronized-output:
    status: supported
    as-of: git:e2b248588a26dc4cc7e6eaf5fa34286584d093ab
    notes: Defers painting until release or a one-second timeout; resize preserves the mode but can repaint current
      state at the new geometry.
    review: reviewed
    checked: '2026-09-10'
    evidence:
    - kind: test
      url: https://github.com/toppk/revenant/blob/e2b248588a26dc4cc7e6eaf5fa34286584d093ab/tests/xvfb-sync-output.sh
  osc-52-write:
    status: partial
    as-of: git:e2b248588a26dc4cc7e6eaf5fa34286584d093ab
    notes: One target letter only; malformed base64 is ignored rather than clearing. CLIPBOARD, PRIMARY and SELECT
      ownership is independent.
    configuration: allowWindowOps overrides disallowedWindowOps; the default list denies this operation.
    review: reviewed
    checked: '2026-09-10'
    evidence:
    - kind: test
      url: https://github.com/toppk/revenant/blob/e2b248588a26dc4cc7e6eaf5fa34286584d093ab/tests/xvfb-clipboard.sh
  osc-52-read:
    status: partial
    as-of: git:e2b248588a26dc4cc7e6eaf5fa34286584d093ab
    notes: Denied queries are silent; external selection requests have a one-second budget and do not support INCR
      transfers.
    configuration: allowWindowOps overrides disallowedWindowOps; the default list denies this operation.
    review: reviewed
    checked: '2026-09-10'
    evidence:
    - kind: test
      url: https://github.com/toppk/revenant/blob/e2b248588a26dc4cc7e6eaf5fa34286584d093ab/tests/xvfb-clipboard.sh
  csi-22-23-t-title-stack:
    status: partial
    as-of: git:e2b248588a26dc4cc7e6eaf5fa34286584d093ab
    notes: Ten-entry title/icon ring and live WM property reads; OSC 1 icon-name updates are not surfaced by libghostty.
    review: reviewed
    checked: '2026-09-10'
    evidence:
    - kind: test
      url: https://github.com/toppk/revenant/blob/e2b248588a26dc4cc7e6eaf5fa34286584d093ab/tests/xvfb-title-stack.sh
  csi-21-t-title-report:
    status: supported
    as-of: git:e2b248588a26dc4cc7e6eaf5fa34286584d093ab
    notes: Reports the live WM title. Default policy denies title queries.
    configuration: allowWindowOps overrides disallowedWindowOps; the default list denies this operation.
    review: reviewed
    checked: '2026-09-10'
    evidence:
    - kind: test
      url: https://github.com/toppk/revenant/blob/e2b248588a26dc4cc7e6eaf5fa34286584d093ab/tests/xvfb-title-stack.sh
  osc-10-11-default-colors-set:
    status: partial
    as-of: git:e2b248588a26dc4cc7e6eaf5fa34286584d093ab
    notes: Updates painted foreground/background and borders. Under DECSCNM, selector semantics differ from xterm.
    configuration: allowColorOps defaults true; when false, disallowedColorOps controls permission.
    review: reviewed
    checked: '2026-09-10'
    evidence:
    - kind: test
      url: https://github.com/toppk/revenant/blob/e2b248588a26dc4cc7e6eaf5fa34286584d093ab/tests/xvfb-dynamic-colors.sh
  osc-10-11-default-colors-query:
    status: partial
    as-of: git:e2b248588a26dc4cc7e6eaf5fa34286584d093ab
    notes: Replies reflect effective colors; denied queries remain silent. Under DECSCNM, selector semantics differ
      from xterm.
    configuration: allowColorOps defaults true; when false, disallowedColorOps controls permission.
    review: reviewed
    checked: '2026-09-10'
    evidence:
    - kind: test
      url: https://github.com/toppk/revenant/blob/e2b248588a26dc4cc7e6eaf5fa34286584d093ab/tests/xvfb-dynamic-colors.sh
  dec-mode-2031-color-scheme-reports:
    status: supported
    as-of: git:e2b248588a26dc4cc7e6eaf5fa34286584d093ab
    notes: Unsolicited reports on scheme changes only while mode 2031 is enabled.
    review: reviewed
    checked: '2026-09-10'
    evidence:
    - kind: test
      url: https://github.com/toppk/revenant/blob/e2b248588a26dc4cc7e6eaf5fa34286584d093ab/tests/xvfb-dynamic-colors.sh
  csi-996-n-color-scheme-query:
    status: supported
    as-of: git:e2b248588a26dc4cc7e6eaf5fa34286584d093ab
    notes: Uses perceived luminance of the displayed background, accounting for DECSCNM.
    review: reviewed
    checked: '2026-09-10'
    evidence:
    - kind: test
      url: https://github.com/toppk/revenant/blob/e2b248588a26dc4cc7e6eaf5fa34286584d093ab/tests/xvfb-dynamic-colors.sh
  osc-133-prompt-marks:
    status: partial
    as-of: git:75abb483ab7796e70f4e8348c3c5d2bab98b1e98
    notes: A/B/C/D and k=s continuation marks are parsed by the core and exposed as row prompt state, a mark index,
      and the core's cell-exact command-output selection; used for prompt navigation only. Click-to-move and redraw
      options are not assessed.
    review: reviewed
    checked: '2026-09-12'
    evidence:
    - kind: test
      url: https://github.com/toppk/revenant/blob/75abb483ab7796e70f4e8348c3c5d2bab98b1e98/tests/xvfb-prompt-navigation.sh
    - kind: test
      url: https://github.com/toppk/revenant/blob/75abb483ab7796e70f4e8348c3c5d2bab98b1e98/src/selftest.c
  ui-prompt-navigation:
    status: supported
    as-of: git:75abb483ab7796e70f4e8348c3c5d2bab98b1e98
    notes: previous-prompt()/next-prompt() actions on Ctrl+Shift+Up/Down move the viewport between OSC 133 prompts
      through scrollback, wrapped and continuation prompts, reflow, and page eviction; no-op on the alternate screen
      and inside the live area.
    review: reviewed
    checked: '2026-09-12'
    evidence:
    - kind: test
      url: https://github.com/toppk/revenant/blob/75abb483ab7796e70f4e8348c3c5d2bab98b1e98/tests/xvfb-prompt-navigation.sh
  ui-pipe-command-output:
    status: supported
    as-of: git:1f99bd0f0844e453df54beb598b4845744e09d9c
    notes: pipe-command-output() (Ctrl+Shift+G) writes the last completed command's OSC 133 output, wrapped lines
      joined, to the pipeCommandOutput helper's stdin in the last OSC 7 directory. Unset by default; output is
      never executed.
    review: reviewed
    checked: '2026-09-12'
    evidence:
    - kind: test
      url: https://github.com/toppk/revenant/blob/1f99bd0f0844e453df54beb598b4845744e09d9c/tests/xvfb-pipe-output.sh
  text-box-drawing:
    status: supported
    as-of: git:7421d5bd57a1756913cd486ed2daf86ffaeae748
    notes: U+2500-U+257F are drawn as cell-geometry rectangles when the primary Xft face lacks the glyph, on the
      bitmap path, or under forceBoxChars; light, heavy and double lines, dashes, arcs and diagonals join exactly
      across cells at any size and in bold.
    review: reviewed
    checked: '2026-09-12'
    evidence:
    - kind: test
      url: https://github.com/toppk/revenant/blob/7421d5bd57a1756913cd486ed2daf86ffaeae748/tests/xvfb-box-glyphs.sh
  text-block-drawing:
    status: supported
    as-of: git:7421d5bd57a1756913cd486ed2daf86ffaeae748
    notes: U+2580-U+259F half, eighth and quadrant blocks are exact cell partitions and the three shades are 2x2
      stipples, clipped to the cell and colored like text under inverse video and selection.
    review: reviewed
    checked: '2026-09-12'
    evidence:
    - kind: test
      url: https://github.com/toppk/revenant/blob/7421d5bd57a1756913cd486ed2daf86ffaeae748/tests/xvfb-box-glyphs.sh
  resource-force-box-chars:
    status: supported
    as-of: git:d4941b5402123004e2fa1126c529ad6c8b1a2451
    notes: forceBoxChars (+fbx enables, -fbx disables), the Procedural Glyphs menu entry (internally
      font-linedrawing) and set-font-linedrawing() force every supported procedural range; turning it off returns
      to the primary face's glyph where present. The bitmap path draws the supported ranges procedurally.
    review: reviewed
    checked: '2026-09-13'
    evidence:
    - kind: test
      url: https://github.com/toppk/revenant/blob/d4941b5402123004e2fa1126c529ad6c8b1a2451/tests/xvfb-box-glyphs.sh
  text-braille-drawing:
    status: supported
    as-of: git:aefafe60bcdbbe7f239636a5387218574b7d2ffe
    notes: U+2800-U+28FF are drawn as equal square dots in two columns of four, sized and spaced from the cell,
      when the primary Xft face lacks the pattern, on the bitmap path, or under forceBoxChars; a cell too narrow
      for a visible dot uses the font, and bold, inverse video, selection and the cursor color dots like text.
    review: reviewed
    checked: '2026-09-12'
    evidence:
    - kind: test
      url: https://github.com/toppk/revenant/blob/aefafe60bcdbbe7f239636a5387218574b7d2ffe/tests/xvfb-box-glyphs.sh
  text-powerline-drawing:
    status: supported
    as-of: git:d4941b5402123004e2fa1126c529ad6c8b1a2451
    notes: U+E0B0-U+E0BF plus U+E0D2 and U+E0D4 are drawn from cell geometry, spanning the full cell height so
      segment colors join, under the primary-font-first rule and forceBoxChars; other Powerline and Nerd Font
      symbols stay with the font.
    review: reviewed
    checked: '2026-09-13'
    evidence:
    - kind: test
      url: https://github.com/toppk/revenant/blob/d4941b5402123004e2fa1126c529ad6c8b1a2451/tests/xvfb-box-glyphs.sh
  text-symbol-whitespace-expansion:
    status: unsupported
    as-of: git:bd0bcf50b695349486aa227fe482e6c6a7c23798
    notes: Current policy is strict in-cell fitting. A one-cell symbol is drawn inside the cells the backend
      committed to it; an oversized monochrome face is shrunk to fit rather than allowed to grow into a
      neighboring blank cell, and the artwork gate asserts that the following cell, the row below and the
      border above stay free of ink. Adopting the optional behavior later would be an opt-in with its own
      eligibility, background, selection, cursor and damage rules; this record describes the present default
      rather than a decision against it. Assessed from the containment assertions only, which do not cover
      legibility.
    review: reviewed
    checked: '2026-09-20'
    evidence:
    - kind: test
      url: https://github.com/toppk/revenant/blob/bd0bcf50b695349486aa227fe482e6c6a7c23798/tests/xvfb-emoji-artwork.sh
  text-procedural-glyphs:
    status: supported
    as-of: git:d4941b5402123004e2fa1126c529ad6c8b1a2451
    notes: 'Procedural ranges: U+23BA-U+23BD; U+2500-U+259F; U+25E2-U+25E5; U+25F8-U+25FA; U+25FF;
      U+2800-U+28FF; U+E0B0-U+E0BF; U+E0D2; U+E0D4; U+1CC1B-U+1CC1E; U+1CC21-U+1CC3F;
      U+1CD00-U+1CDE5; U+1CE00-U+1CE01; U+1CE0B-U+1CE0C; U+1CE16-U+1CE19; U+1CE51-U+1CE8F;
      U+1CE90-U+1CEAF; U+1FB00-U+1FB92; U+1FB94-U+1FBAF; U+1FBBD-U+1FBBF; U+1FBCE-U+1FBEF.
      The primary Xft face wins unless forceBoxChars is enabled; bitmap rendering always uses the procedural path.'
    review: reviewed
    checked: '2026-09-13'
    evidence:
    - kind: test
      url: https://github.com/toppk/revenant/blob/d4941b5402123004e2fa1126c529ad6c8b1a2451/tests/xvfb-box-glyphs.sh
  selection-copy-feedback:
    status: supported
    as-of: git:8fac827f73fa280d52ab317de672639e7efd258e
    notes: copyFlashDuration (milliseconds, 0 disables and is the default) flashes the cells a selection gesture
      just copied to PRIMARY or CLIPBOARD, on copyFlashColor or in their unselected colors; copied bytes are
      unchanged, a new gesture, selection loss or an OSC 52 replacement ends it, OSC 52 writes never start it,
      and synchronized-output holds never show it.
    review: reviewed
    checked: '2026-09-12'
    evidence:
    - kind: test
      url: https://github.com/toppk/revenant/blob/8fac827f73fa280d52ab317de672639e7efd258e/tests/xvfb-copy-flash.sh
  search-scrollback-literal:
    status: supported
    as-of: git:3c1d6645fca28238ecd7529b33ae7e71955a04d9
    notes: Literal codepoint search on whole grapheme clusters across soft-wrapped primary-screen lines, overlaps
      included, in bounded steps, now reachable through the search overlay; matches follow scrolling, eviction
      and reflow, overwritten matches are dropped when navigated, and the alternate screen is declined.
