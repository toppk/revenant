schema_version: 1
terminal: revenant
name: Revenant
page: terminals/revenant.md
features:
  osc-7-working-directory:
    status: partial
    as-of: git:e2b248588a26dc4cc7e6eaf5fa34286584d093ab
    notes: Retains a validated local directory; no consumer yet. Oversized OSC 7 clears retained state. Does not
      chdir.
    review: reviewed
    checked: '2026-09-10'
    evidence:
    - kind: test
      url: https://github.com/toppk/revenant/blob/e2b248588a26dc4cc7e6eaf5fa34286584d093ab/tests/xvfb-working-directory.sh
  sgr-58-underline-color:
    status: supported
    as-of: git:e2b248588a26dc4cc7e6eaf5fa34286584d093ab
    notes: Explicit underline ink stays opaque through inverse, selection and faint; SGR 59 restores text color.
    review: reviewed
    checked: '2026-09-10'
    evidence:
    - kind: test
      url: https://github.com/toppk/revenant/blob/e2b248588a26dc4cc7e6eaf5fa34286584d093ab/tests/xvfb-underline-color.sh
  dcs-xtgettcap:
    status: partial
    as-of: git:e2b248588a26dc4cc7e6eaf5fa34286584d093ab
    notes: TN agrees with child TERM. This assessment covers TN only; the full capability set is not assessed. GetTcap
      policy applies.
    review: reviewed
    checked: '2026-09-10'
    evidence:
    - kind: test
      url: https://github.com/toppk/revenant/blob/e2b248588a26dc4cc7e6eaf5fa34286584d093ab/tests/xvfb-term-name.sh
  c0-enq-answerback:
    status: supported
    as-of: git:e2b248588a26dc4cc7e6eaf5fa34286584d093ab
    notes: Configured bytes sent verbatim; default empty string is silent.
    review: reviewed
    checked: '2026-09-10'
    evidence:
    - kind: test
      url: https://github.com/toppk/revenant/blob/e2b248588a26dc4cc7e6eaf5fa34286584d093ab/tests/xvfb-answerback.sh
  csi-da1:
    status: supported
    as-of: git:fd6dee5cbec31ee19ed4be6514e63fc08088b123
    notes: 'Replies CSI ? 62 ; 6 ; 21 ; 22 c: VT220 level with selective erase, left/right margins and ANSI color,
      each pinned by rendered-cell backend tests. 132 columns, Sixel, ReGIS, locator, rectangular editing and
      Ghostty''s clipboard code are deliberately absent. Nonzero parameters are answered (xterm ignores them).'
    review: reviewed
    checked: '2026-09-11'
    evidence:
    - kind: test
      url: https://github.com/toppk/revenant/blob/fd6dee5cbec31ee19ed4be6514e63fc08088b123/tests/xvfb-device-attributes.sh
    - kind: test
      url: https://github.com/toppk/revenant/blob/fd6dee5cbec31ee19ed4be6514e63fc08088b123/src/selftest.c
    - kind: source
      url: https://github.com/toppk/revenant/blob/fd6dee5cbec31ee19ed4be6514e63fc08088b123/src/device_attributes.h
  csi-da2:
    status: supported
    as-of: git:fd6dee5cbec31ee19ed4be6514e63fc08088b123
    notes: 'Replies CSI > 1 ; Pv ; 0 c with Pv = major * 10000 + minor * 100 + patch of the Revenant version. The
      type is VT220 to match DA1; XTVERSION is the identification path.'
    review: reviewed
    checked: '2026-09-11'
    evidence:
    - kind: test
      url: https://github.com/toppk/revenant/blob/fd6dee5cbec31ee19ed4be6514e63fc08088b123/tests/xvfb-device-attributes.sh
    - kind: source
      url: https://github.com/toppk/revenant/blob/fd6dee5cbec31ee19ed4be6514e63fc08088b123/src/device_attributes.c
  csi-da3:
    status: supported
    as-of: git:fd6dee5cbec31ee19ed4be6514e63fc08088b123
    notes: Replies DCS ! | 00000000 ST at every level; there is no unit ID. xterm answers only at VT420 or higher.
    review: reviewed
    checked: '2026-09-11'
    evidence:
    - kind: test
      url: https://github.com/toppk/revenant/blob/fd6dee5cbec31ee19ed4be6514e63fc08088b123/tests/xvfb-device-attributes.sh
  csi-xtversion:
    status: supported
    as-of: git:fd6dee5cbec31ee19ed4be6514e63fc08088b123
    notes: Replies DCS > | revenant(<version>) ST following xterm's XTerm(411) display form with the actual product
      and version.
    review: reviewed
    checked: '2026-09-11'
    evidence:
    - kind: test
      url: https://github.com/toppk/revenant/blob/fd6dee5cbec31ee19ed4be6514e63fc08088b123/tests/xvfb-device-attributes.sh
  diagnostics-unknown-apc:
    status: supported
    as-of: git:ab0907105bf6a871ef473dfbc0e929c8ff6b4d11
    notes: Completed APCs other than Kitty graphics and the glyph protocol are logged at info level with up to 256
      payload bytes and a truncation flag; no reply, no permission. ESC ends an APC; CAN/SUB abort without a
      report. Other C0 bytes, including NUL, are retained as binary data. OSC/CSI remain invisible (upstream
      limitation).
    review: reviewed
    checked: '2026-09-11'
    evidence:
    - kind: test
      url: https://github.com/toppk/revenant/blob/ab0907105bf6a871ef473dfbc0e929c8ff6b4d11/tests/xvfb-unknown-apc.sh
    - kind: test
      url: https://github.com/toppk/revenant/blob/ab0907105bf6a871ef473dfbc0e929c8ff6b4d11/src/selftest.c
  osc-9-notification:
    status: partial
    as-of: git:87fdc41407fe2a096bd7f5d59456bfe61b7b80f9
    notes: iTerm2 form decoded with an empty title and the body as sent, logged, and mapped to X11 urgency while
      unfocused. No desktop delivery. Valid ConEmu forms remain separate; incomplete or invalid ConEmu-shaped
      payloads fall back to notification text in libghostty.
    review: reviewed
    checked: '2026-09-11'
    evidence:
    - kind: test
      url: https://github.com/toppk/revenant/blob/87fdc41407fe2a096bd7f5d59456bfe61b7b80f9/tests/xvfb-notification-urgency.sh
    - kind: test
      url: https://github.com/toppk/revenant/blob/87fdc41407fe2a096bd7f5d59456bfe61b7b80f9/src/selftest.c
  osc-777-notification:
    status: partial
    as-of: git:87fdc41407fe2a096bd7f5d59456bfe61b7b80f9
    notes: notify;title;body is decoded, logged, and mapped to X11 urgency while unfocused. No desktop delivery;
      other rxvt extensions are dropped by the core.
    review: reviewed
    checked: '2026-09-11'
    evidence:
    - kind: test
      url: https://github.com/toppk/revenant/blob/87fdc41407fe2a096bd7f5d59456bfe61b7b80f9/tests/xvfb-notification-urgency.sh
    - kind: test
      url: https://github.com/toppk/revenant/blob/87fdc41407fe2a096bd7f5d59456bfe61b7b80f9/src/selftest.c
  notification-x11-urgency:
    status: supported
    as-of: git:87fdc41407fe2a096bd7f5d59456bfe61b7b80f9
    notes: XUrgencyHint is set for notifications received while unfocused and cleared on focus-in. Every other
      WM_HINTS field is preserved, repeated requests are idempotent, and failed hint updates remain retryable.
    review: reviewed
    checked: '2026-09-11'
    evidence:
    - kind: test
      url: https://github.com/toppk/revenant/blob/87fdc41407fe2a096bd7f5d59456bfe61b7b80f9/tests/xvfb-notification-urgency.sh
    - kind: source
      url: https://github.com/toppk/revenant/blob/87fdc41407fe2a096bd7f5d59456bfe61b7b80f9/src/urgency.c
  csi-decscusr:
    status: partial
    as-of: git:e2b248588a26dc4cc7e6eaf5fa34286584d093ab
    notes: 0 and omitted restore the configured startup shape. xterm-specific style 7 is not recognized.
    review: reviewed
    checked: '2026-09-10'
    evidence:
    - kind: test
      url: https://github.com/toppk/revenant/blob/e2b248588a26dc4cc7e6eaf5fa34286584d093ab/tests/xvfb-cursor-shape.sh
  osc-8-hyperlinks:
    status: partial
    as-of: git:e2b248588a26dc4cc7e6eaf5fa34286584d093ab
    notes: Shift-hover underlines OSC 8 links; Shift+Button 1 activates HTTP(S). Other URI schemes are inert.
    review: reviewed
    checked: '2026-09-10'
    evidence:
    - kind: test
      url: https://github.com/toppk/revenant/blob/e2b248588a26dc4cc7e6eaf5fa34286584d093ab/tests/xvfb-hyperlink-hover.sh
  dec-mode-2026-synchronized-output:
    status: supported
    as-of: git:e2b248588a26dc4cc7e6eaf5fa34286584d093ab
    notes: Defers painting until release or a one-second timeout; resize preserves the mode but can repaint current
      state at the new geometry.
    review: reviewed
    checked: '2026-09-10'
    evidence:
    - kind: test
      url: https://github.com/toppk/revenant/blob/e2b248588a26dc4cc7e6eaf5fa34286584d093ab/tests/xvfb-sync-output.sh
  osc-52-write:
    status: partial
    as-of: git:e2b248588a26dc4cc7e6eaf5fa34286584d093ab
    notes: One target letter only; malformed base64 is ignored rather than clearing. CLIPBOARD, PRIMARY and SELECT
      ownership is independent.
    configuration: allowWindowOps overrides disallowedWindowOps; the default list denies this operation.
    review: reviewed
    checked: '2026-09-10'
    evidence:
    - kind: test
      url: https://github.com/toppk/revenant/blob/e2b248588a26dc4cc7e6eaf5fa34286584d093ab/tests/xvfb-clipboard.sh
  osc-52-read:
    status: partial
    as-of: git:e2b248588a26dc4cc7e6eaf5fa34286584d093ab
    notes: Denied queries are silent; external selection requests have a one-second budget and do not support INCR
      transfers.
    configuration: allowWindowOps overrides disallowedWindowOps; the default list denies this operation.
    review: reviewed
    checked: '2026-09-10'
    evidence:
    - kind: test
      url: https://github.com/toppk/revenant/blob/e2b248588a26dc4cc7e6eaf5fa34286584d093ab/tests/xvfb-clipboard.sh
  csi-22-23-t-title-stack:
    status: partial
    as-of: git:e2b248588a26dc4cc7e6eaf5fa34286584d093ab
    notes: Ten-entry title/icon ring and live WM property reads; OSC 1 icon-name updates are not surfaced by libghostty.
    review: reviewed
    checked: '2026-09-10'
    evidence:
    - kind: test
      url: https://github.com/toppk/revenant/blob/e2b248588a26dc4cc7e6eaf5fa34286584d093ab/tests/xvfb-title-stack.sh
  csi-21-t-title-report:
    status: supported
    as-of: git:e2b248588a26dc4cc7e6eaf5fa34286584d093ab
    notes: Reports the live WM title. Default policy denies title queries.
    configuration: allowWindowOps overrides disallowedWindowOps; the default list denies this operation.
    review: reviewed
    checked: '2026-09-10'
    evidence:
    - kind: test
      url: https://github.com/toppk/revenant/blob/e2b248588a26dc4cc7e6eaf5fa34286584d093ab/tests/xvfb-title-stack.sh
  osc-10-11-default-colors-set:
    status: partial
    as-of: git:e2b248588a26dc4cc7e6eaf5fa34286584d093ab
    notes: Updates painted foreground/background and borders. Under DECSCNM, selector semantics differ from xterm.
    configuration: allowColorOps defaults true; when false, disallowedColorOps controls permission.
    review: reviewed
    checked: '2026-09-10'
    evidence:
    - kind: test
      url: https://github.com/toppk/revenant/blob/e2b248588a26dc4cc7e6eaf5fa34286584d093ab/tests/xvfb-dynamic-colors.sh
  osc-10-11-default-colors-query:
    status: partial
    as-of: git:e2b248588a26dc4cc7e6eaf5fa34286584d093ab
    notes: Replies reflect effective colors; denied queries remain silent. Under DECSCNM, selector semantics differ
      from xterm.
    configuration: allowColorOps defaults true; when false, disallowedColorOps controls permission.
    review: reviewed
    checked: '2026-09-10'
    evidence:
    - kind: test
      url: https://github.com/toppk/revenant/blob/e2b248588a26dc4cc7e6eaf5fa34286584d093ab/tests/xvfb-dynamic-colors.sh
  dec-mode-2031-color-scheme-reports:
    status: supported
    as-of: git:e2b248588a26dc4cc7e6eaf5fa34286584d093ab
    notes: Unsolicited reports on scheme changes only while mode 2031 is enabled.
    review: reviewed
    checked: '2026-09-10'
    evidence:
    - kind: test
      url: https://github.com/toppk/revenant/blob/e2b248588a26dc4cc7e6eaf5fa34286584d093ab/tests/xvfb-dynamic-colors.sh
  csi-996-n-color-scheme-query:
    status: supported
    as-of: git:e2b248588a26dc4cc7e6eaf5fa34286584d093ab
    notes: Uses perceived luminance of the displayed background, accounting for DECSCNM.
    review: reviewed
    checked: '2026-09-10'
    evidence:
    - kind: test
      url: https://github.com/toppk/revenant/blob/e2b248588a26dc4cc7e6eaf5fa34286584d093ab/tests/xvfb-dynamic-colors.sh
  osc-133-prompt-marks:
    status: partial
    as-of: git:75abb483ab7796e70f4e8348c3c5d2bab98b1e98
    notes: A/B/C/D and k=s continuation marks are parsed by the core and exposed as row prompt state, a mark index,
      and the core's cell-exact command-output selection; used for prompt navigation only. Click-to-move and redraw
      options are not assessed.
    review: reviewed
    checked: '2026-09-12'
    evidence:
    - kind: test
      url: https://github.com/toppk/revenant/blob/75abb483ab7796e70f4e8348c3c5d2bab98b1e98/tests/xvfb-prompt-navigation.sh
    - kind: test
      url: https://github.com/toppk/revenant/blob/75abb483ab7796e70f4e8348c3c5d2bab98b1e98/src/selftest.c
  ui-prompt-navigation:
    status: supported
    as-of: git:75abb483ab7796e70f4e8348c3c5d2bab98b1e98
    notes: previous-prompt()/next-prompt() actions on Ctrl+Shift+Up/Down move the viewport between OSC 133 prompts
      through scrollback, wrapped and continuation prompts, reflow, and page eviction; no-op on the alternate screen
      and inside the live area.
    review: reviewed
    checked: '2026-09-12'
    evidence:
    - kind: test
      url: https://github.com/toppk/revenant/blob/75abb483ab7796e70f4e8348c3c5d2bab98b1e98/tests/xvfb-prompt-navigation.sh
  ui-pipe-command-output:
    status: supported
    as-of: git:1f99bd0f0844e453df54beb598b4845744e09d9c
    notes: pipe-command-output() (Ctrl+Shift+G) writes the last completed command's OSC 133 output, wrapped lines
      joined, to the pipeCommandOutput helper's stdin in the last OSC 7 directory. Unset by default; output is
      never executed.
    review: reviewed
    checked: '2026-09-12'
    evidence:
    - kind: test
      url: https://github.com/toppk/revenant/blob/1f99bd0f0844e453df54beb598b4845744e09d9c/tests/xvfb-pipe-output.sh
