site_name: Revenant
site_description: An xterm-compatible X11 terminal with a modern libghostty core.
site_url: https://toppk.github.io/revenant/docs/
repo_url: https://github.com/toppk/revenant
repo_name: toppk/revenant
edit_uri: edit/master/docs/
docs_dir: docs
site_dir: site
copyright: Revenant documentation is MIT licensed. xterm-derived material is covered by the xterm license.

# The xman-style theme derives the Sections menu and every directory from page
# front matter (man, section, manual, description); there is no nav to maintain.
theme:
  name: null
  custom_dir: docs-theme

hooks:
  - tools/mkdocs-hooks.py

plugins:
  - search

extra:
  tdn_url: https://toppk.github.io/revenant/tdn/
  manuals:
    - id: revenant
      label: "(1) Revenant"
      head: Revenant Manual
      description: The program manual, from installation to the compatibility ledgers.
    - id: compat
      label: "(7) Compatibility"
      head: Compatibility ledgers
      description: How faithfully Revenant tracks xterm and Ghostling, audit by audit.
    - id: x11
      label: "(7) X11 and Unix basics"
      head: X11 and Unix basics
      description: The platform a terminal lives on, explained from scratch.
    - id: maintainers
      label: "(8) Maintainers"
      head: Maintainer Manual
      description: Architecture, contracts, style, and release procedure.

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.keys
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
